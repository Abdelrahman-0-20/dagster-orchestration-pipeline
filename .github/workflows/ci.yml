name: verify

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly: catches upstream/toolchain drift
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit refreshed dashboard CSVs back to the repo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the project gate
        run: ./verify.sh

      # The dashboard reads committed CSVs (Streamlit Cloud has no warehouse),
      # so CI runs the real pipeline against the live API, then publishes gold.
      - name: Run the production asset job (live World Bank API)
        run: dagster job execute -m dagster_pipeline.definitions -j daily_world_bank_refresh

      - name: Export dashboard data
        run: python -m src.export_dashboard

      - name: Commit refreshed dashboard data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/data
          if git diff --cached --quiet; then
            echo "dashboard data already fresh"
          else
            git commit -m "chore: refresh dashboard data [skip ci]"
            git push
          fi
